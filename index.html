<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mount Road Office — Asset Management</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">MR</div>
        <div class="brand-text">
          <div class="brand-title">Mount Road Office</div>
          <div class="brand-sub">Asset Management</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span><span>Dashboard</span>
        </button>
        <button class="nav-item" data-page="assignment">
          <span class="nav-icon">🗂️</span><span>Asset Assignment</span>
        </button>
        <button class="nav-item" data-page="inventory">
          <span class="nav-icon">💻</span><span>Master Inventory</span>
        </button>
        <button class="nav-item" data-page="employees">
          <span class="nav-icon">👥</span><span>Employees</span>
        </button>
        <button class="nav-item" data-page="stock">
          <span class="nav-icon">📦</span><span>Stock Summary</span>
        </button>
        <button class="nav-item" data-page="refill">
          <span class="nav-icon">➕</span><span>Stock Refill Log</span>
        </button>
        <button class="nav-item" data-page="categories">
          <span class="nav-icon">🏷️</span><span>Asset Categories</span>
        </button>
        <button class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span><span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="role-box">
          <div class="role-row">
            <span class="role-label">Signed in as</span>
            <span class="role-badge" id="roleBadge">Viewer</span>
          </div>
          <button class="btn-ghost" id="roleSwitchBtn">Switch to Admin</button>
        </div>
        <button class="btn-ghost" id="resetDataBtn" title="Reset to original sheet data">↺ Reset Data</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger">☰</button>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <div class="topbar-right">
          <span class="live-dot"></span>
          <span class="live-text">Live snapshot · saved locally in your browser</span>
        </div>
      </header>

      <main class="content" id="content">
        <!-- page content injected here -->
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Title</h2>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- hidden file input used for bulk employee import (CSV / XLSX / XLS) -->
  <input type="file" id="employeeFileInput" accept=".csv,.xlsx,.xls,text/csv" style="display:none" />

  <script src="js/xlsx.full.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
